<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="VC Kalken sfeerbeeld">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081c38"/>
      <stop offset="50%" stop-color="#0d2d52"/>
      <stop offset="100%" stop-color="#1c64b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="12%" r="60%">
      <stop offset="0" stop-color="#f6b821" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#f6b821" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="95%" r="45%">
      <stop offset="0" stop-color="#1c64b4" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#1c64b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ballsh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe9ad"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <!-- ghost wordmark -->
  <text x="-30" y="835" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"
        font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="290" font-weight="800" letter-spacing="6">KALKEN</text>
  <!-- court lines -->
  <g stroke="#ffffff" stroke-opacity=".09" stroke-width="3" fill="none">
    <path d="M0 640 L1600 470"/>
    <path d="M0 780 L1600 590"/>
    <path d="M260 900 L600 460"/>
    <path d="M760 900 L950 460"/>
  </g>
  <!-- net -->
  <g stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <line x1="110" y1="250" x2="110" y2="540"/>
    <line x1="450" y1="250" x2="450" y2="540"/>
    <line x1="110" y1="250" x2="450" y2="250"/>
    <line x1="110" y1="290" x2="450" y2="290"/>
    <line x1="110" y1="330" x2="450" y2="330"/>
    <line x1="110" y1="370" x2="450" y2="370"/>
    <line x1="150" y1="250" x2="150" y2="400"/><line x1="190" y1="250" x2="190" y2="400"/>
    <line x1="230" y1="250" x2="230" y2="400"/><line x1="270" y1="250" x2="270" y2="400"/>
    <line x1="310" y1="250" x2="310" y2="400"/><line x1="350" y1="250" x2="350" y2="400"/>
    <line x1="390" y1="250" x2="390" y2="400"/>
    <line x1="110" y1="400" x2="450" y2="400"/>
  </g>
  <!-- motion arcs -->
  <g stroke="#f6b821" stroke-opacity=".45" fill="none" stroke-linecap="round">
    <path d="M860 430 q170 -150 370 -120" stroke-width="4" stroke-dasharray="2 26"/>
    <path d="M820 500 q210 -190 450 -150" stroke-width="3" stroke-dasharray="2 30" stroke-opacity=".25"/>
  </g>
  <!-- volleyball -->
  <circle cx="1240" cy="260" r="200" fill="url(#glow)" opacity=".9"/>
  <g transform="translate(1240 260) rotate(-14)">
    <circle r="125" fill="url(#ballsh)"/>
    <circle r="125" fill="none" stroke="#ffd966" stroke-width="12"/>
    <g fill="none" stroke-width="5">
      <path d="M-125 0 Q0 -66 125 0" stroke="#1c64b4" stroke-opacity=".75"/>
      <path d="M-118 -40 Q0 -104 118 -40" stroke="#1c64b4" stroke-opacity=".55"/>
      <path d="M-125 0 Q0 66 125 0" stroke="#0a2342" stroke-opacity=".65"/>
      <path d="M-118 40 Q0 104 118 40" stroke="#0a2342" stroke-opacity=".45"/>
      <path d="M0 -125 Q-72 0 0 125" stroke="#0a2342" stroke-opacity=".55"/>
      <path d="M44 -117 Q-20 0 44 117" stroke="#1c64b4" stroke-opacity=".5"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="Plus Jakarta Sans, Arial, sans-serif">
    <rect x="104" y="700" width="46" height="5" rx="2.5" fill="#f6b821"/>
    <text x="104" y="756" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="1">VC KALKEN</text>
    <text x="104" y="796" fill="#cfe0f4" font-size="22" font-weight="600" letter-spacing="4">SAMEN GROEIEN · SAMEN WINNEN</text>
  </g>
</svg>
