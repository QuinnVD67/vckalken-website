<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="VC Kalken ploeg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081c38"/>
      <stop offset="55%" stop-color="#10365f"/>
      <stop offset="100%" stop-color="#1c64b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#f6b821" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#f6b821" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ballsh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f7e9c4"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <!-- court lines -->
  <g stroke="#ffffff" stroke-opacity=".08" stroke-width="3" fill="none">
    <path d="M0 700 L1400 560"/>
    <path d="M0 830 L1400 690"/>
    <path d="M330 900 L560 560"/>
    <path d="M900 900 L1010 560"/>
  </g>
  <!-- emblem -->
  <g transform="translate(700 340)">
    <circle r="150" fill="none" stroke="#f6b821" stroke-opacity=".25" stroke-width="2"/>
    <g transform="rotate(-14)">
      <circle r="112" fill="url(#ballsh)"/>
      <circle r="112" fill="none" stroke="#f6b821" stroke-width="6"/>
      <g fill="none" stroke-width="4.5">
        <path d="M-112 0 Q0 -59 112 0" stroke="#1c64b4" stroke-opacity=".55"/>
        <path d="M-106 -36 Q0 -93 106 -36" stroke="#1c64b4" stroke-opacity=".4"/>
        <path d="M-112 0 Q0 59 112 0" stroke="#0a2342" stroke-opacity=".45"/>
        <path d="M-106 36 Q0 93 106 36" stroke="#0a2342" stroke-opacity=".3"/>
        <path d="M0 -112 Q-64 0 0 112" stroke="#0a2342" stroke-opacity=".4"/>
        <path d="M39 -105 Q-18 0 39 105" stroke="#1c64b4" stroke-opacity=".35"/>
      </g>
    </g>
  </g>
  <g font-family="Plus Jakarta Sans, Arial, sans-serif" text-anchor="middle">
    <text x="700" y="600" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="2">VC KALKEN</text>
    <g fill="#f6b821"><rect x="540" y="636" width="70" height="4" rx="2"/><rect x="790" y="636" width="70" height="4" rx="2"/></g>
    <text x="700" y="668" fill="#cfe0f4" font-size="26" font-weight="600" letter-spacing="5">SAMEN GROEIEN · SAMEN WINNEN</text>
  </g>
</svg>
