name: Wedstrijden bijwerken

# Haalt om de 3 uur de nieuwste wedstrijden op bij Volleyscores en commit enkel
# als er iets veranderd is. Staat de site op GitHub Pages, Netlify of Cloudflare
# Pages, dan wordt hij na die commit vanzelf opnieuw gepubliceerd.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:   # ook handmatig te starten via het tabblad 'Actions'

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wedstrijden ophalen
        run: python tools/update_matches.py

      - name: Wijzigingen opslaan
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "vck-website-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Wedstrijden automatisch bijgewerkt"
            git push
          else
            echo "Geen wijzigingen."
          fi
